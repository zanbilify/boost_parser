[package]
name = "boost_parser"
description = "Boost C++ library boost_parser packaged using Zanbil"
version = "0.1.0"
edition = "2024"
links = "boost_parser"
license = "BSL-1.0"
repository = "https://github.com/zanbilify/boost_parser"

[package.metadata.zanbil]
make_dependencies_public = true

[dependencies]
boost_assert = { version = "0.1.0", path = "../boost_assert" }
boost_charconv = { version = "0.1.0", path = "../boost_charconv" }
boost_hana = { version = "0.1.0", path = "../boost_hana" }
boost_type_index = { version = "0.1.0", path = "../boost_type_index" }

[build-dependencies]
zanbil-boost-build = "0.1.0"
